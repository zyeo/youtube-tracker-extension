<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Tracker Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-page">
    <main class="options-container">
      <header class="options-header">
        <h1 class="options-title">YouTube Tracker Options</h1>
        <p class="options-subtitle">Configure your daily goal and local history retention.</p>
      </header>

      <section class="options-card" aria-labelledby="settings-title">
        <h2 id="settings-title" class="options-card-title">Tracking settings</h2>
        <p class="options-card-text">
          Configure your daily time goal and how long local daily history is kept.
        </p>
        <form id="settings-form" class="options-form">
          <label for="daily-goal-minutes">Daily goal (minutes)</label>
          <input
            id="daily-goal-minutes"
            name="dailyGoalMinutes"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            required
          />

          <label for="retention-days">Retention days</label>
          <input
            id="retention-days"
            name="retentionDays"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            required
          />
          <button type="submit">Save</button>
          <p id="save-status" class="options-card-text" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
